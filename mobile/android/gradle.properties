# A 2 GB build machine needs a small heap and no daemon; the first attempt at
# this project died with "Gradle daemon disappeared unexpectedly" at defaults.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
